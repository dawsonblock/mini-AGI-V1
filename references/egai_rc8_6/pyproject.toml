[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egai-governed-continual-intelligence"
version = "0.3.6"
description = "EGAI v3 RC8.6 end-to-end governed learning integration harness"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
egai = "egai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
