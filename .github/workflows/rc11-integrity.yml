name: mini-AGI converged validation
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The test suite imports torch/transformers/safetensors at
      # collection time and peft at runtime (tests-python and the
      # references/oracle_reference suite). These were missing since the
      # Route-B commit (a2a7295) started importing them, which left
      # every run red; faiss/trl are imported nowhere and stay out.
      - run: python -m pip install '.[dev]' torch transformers peft safetensors flask
      - run: bash scripts/rc11/validate_all.sh
      - run: cmake -S . -B ../native-build -DQW3_ENABLE_CUDA=OFF -DQW3_ENABLE_METAL_GDN=OFF -DQW3_BUILD_TESTS=ON
      - run: cmake --build ../native-build --parallel 4
      - run: ctest --test-dir ../native-build --output-on-failure

  # Lint contract (pyproject.toml [tool.ruff]/[tool.pylint], .flake8).
  # Runs on Linux only: the contract is platform-independent and the
  # findings are identical across runners; the matrix job below covers
  # platform behaviour.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: bash scripts/rc11/lint.sh

  # Clean-extraction release check: a tag checkout is the closest CI
  # equivalent of unzipping a published archive — every governed file
  # must match the signed manifest and the bundled key must carry the
  # pinned trusted-release fingerprint. Runs on version tags only:
  # between releases the manifest is intentionally stale (it is
  # re-signed at release points, not per commit).
  release-integrity:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python scripts/verify_release.py
